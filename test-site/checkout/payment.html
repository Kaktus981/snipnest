<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>模拟支付页面 · 文栈安全测试</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Segoe UI Variable","Microsoft YaHei UI",sans-serif;color:#172039;background:radial-gradient(circle at 80% 10%,#ffe5e8,transparent 32rem),#f6f7fb}.card{width:min(620px,100%);padding:34px;border:1px solid #eadfe2;border-radius:26px;background:white;box-shadow:0 30px 80px rgba(69,39,48,.13)}.badge{display:inline-flex;padding:6px 10px;border-radius:99px;color:#b54350;background:#fff0f1;font-size:12px;font-weight:800}h1{margin:18px 0 8px;font-size:34px}p{color:#6f7891;line-height:1.7}.warning{margin:22px 0;padding:15px;border-radius:14px;color:#835923;background:#fff4dc;line-height:1.6}label{display:block;margin:13px 0 6px;font-size:13px;font-weight:750}input{width:100%;padding:13px;border:1px solid #dfe2eb;border-radius:12px;font:inherit}a{display:inline-flex;margin-top:22px;padding:11px 15px;border-radius:12px;color:white;background:#5261df;text-decoration:none;font-weight:750}
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">敏感网址拦截测试</span>
      <h1>模拟支付页面</h1>
      <p>网址路径中包含 <code>checkout/payment</code>。即使你已经授权整个本地网站，文栈也应该在这一页自动停止保护。</p>
      <div class="warning"><strong>请只使用页面预填的虚构数据。</strong>不要输入自己的银行卡、密码、验证码或任何真实个人信息。</div>
      <label for="fake-card">虚构银行卡号</label>
      <input id="fake-card" name="card_number" autocomplete="cc-number" value="4111 1111 1111 1111" />
      <label for="fake-note">支付备注</label>
      <input id="fake-note" name="payment_note" value="这是一段不会被文栈保存的模拟支付备注" />
      <p>检查方法：点击输入框，页面上不应出现“文”；打开插件 Popup，应看到“敏感页面”与“此页面自动禁用”。</p>
      <a href="../index.html#sensitive">← 返回全功能测试站</a>
    </main>
  </body>
</html>
